<style>
:root{
  --navy:#253746; --midnight:#131E29; --ink:#3D3935; --stone:#C4BCB7; --gold:#D69A2D;
  --red:#9A3324; --taupe:#746661; --cloud:#F0EEED; --line:#E8E5E2;
  --green:#3f6f52; --amber:#b07d2a;
  --sans:"Source Sans 3",-apple-system,sans-serif; --ui:var(--sans);
  --r:10px; --shadow:0 10px 34px -18px rgba(19,30,41,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#FCFBFA;color:#3D3935;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:var(--ui);cursor:pointer}
input,textarea,select{font-family:var(--sans);font-size:14px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;width:100%;background:#fff;color:#3D3935}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy)}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);margin:14px 0 6px}
.hide{display:none!important}

/* ===== Login ===== */
#login{position:fixed;inset:0;background:linear-gradient(155deg,#1b2a37,#131E29 55%,#0d1720);display:flex;align-items:center;justify-content:center;z-index:50;overflow:hidden}
#login::before{content:"";position:absolute;top:-12%;bottom:-12%;right:-14%;width:44%;background:rgba(255,255,255,.035);transform:skewX(-19deg);pointer-events:none}
aside{overflow:hidden}
aside::after{content:"";position:absolute;top:-10%;bottom:-10%;right:-46%;width:60%;background:rgba(255,255,255,.025);transform:skewX(-19deg);pointer-events:none}
.login-card{width:min(420px,92vw);background:#fff;border-radius:10px;padding:42px 40px;box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
.login-card img{height:34px;margin-bottom:8px}
.login-card h1{font-size:22px;color:var(--navy);letter-spacing:-.3px}
.login-card p.sub{color:var(--taupe);font-size:13.5px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:100px;padding:13px 24px;font-size:14px;font-weight:600;transition:transform .18s,box-shadow .18s}
.btn:hover{transform:translateY(-1px)}
.btn-navy{background:var(--navy);color:#fff;width:100%;margin-top:20px}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--navy)}
.login-foot{margin-top:18px;font-size:11.5px;color:#9aa4ac;text-align:center}

/* ===== Shell ===== */
#app{display:flex;min-height:100vh}
aside{width:248px;flex:none;background:var(--midnight);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{padding:26px 28px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-brand img{height:18px}
.side-brand .plat{font-family:var(--ui);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);margin-top:9px}
nav{padding:14px 12px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:rgba(255,255,255,.72);font-size:14px;font-weight:500;padding:11px 14px;border-radius:10px;margin-bottom:3px;text-align:left;transition:background .18s,color .18s}
.nav-item svg{width:17px;height:17px;flex:none}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.nav-item .pill{margin-left:auto;background:var(--gold);color:var(--midnight);font-size:10px;font-weight:700;border-radius:100px;padding:2px 8px}
.side-user{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--stone);color:var(--midnight);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.side-user .nm{font-size:13px;font-weight:600}
.side-user .em{font-size:11px;color:rgba(255,255,255,.5)}
main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:10;background:rgba(252,251,250,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:18px 40px;display:flex;align-items:center;justify-content:space-between}
.topbar h2{font-size:19px;color:var(--navy);letter-spacing:-.2px}
.topbar .acts{display:flex;gap:10px;align-items:center}
.top-link{font-family:var(--ui);font-size:13px;color:var(--taupe);text-decoration:none;border:1.5px solid var(--line);border-radius:100px;padding:8px 16px;background:#fff}
.content{padding:32px 40px 70px}

/* ===== bits ===== */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.stat .k{font-family:var(--ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:600}
.stat .v{font-size:30px;font-weight:800;color:var(--navy);margin-top:6px;letter-spacing:-.5px}
.stat .d{font-size:12px;margin-top:4px;color:var(--green);font-weight:600}
.stat .d.na{color:#9aa4ac;font-weight:500}
.sec-t{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:14px}
.banner{display:flex;gap:13px;align-items:flex-start;border-radius:10px;padding:15px 18px;font-size:13px;margin-bottom:20px}
.banner.amber{background:#faf3e4;border:1px solid #ecd9b0;color:#7c5a1e}
.banner.blue{background:#eef2f6;border:1px solid #d5dee7;color:var(--navy)}
.banner b{display:block;margin-bottom:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
.dot.g{background:#3f9f6a}.dot.a{background:#d9a13c}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--ui);text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);padding:10px 12px;border-bottom:1.5px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-family:var(--ui);font-size:11px;font-weight:600;border-radius:100px;padding:4px 11px}
.tag.new{background:#eaf3ee;color:var(--green)}
.tag.done{background:#eef2f6;color:var(--taupe)}
.tag.prog{background:#faf3e4;color:var(--amber)}
.tag.red{background:#f7e9e6;color:var(--red)}
.stars{color:#FBBC04;letter-spacing:2px;font-size:15px}
.icon-btn{background:#fff;border:1.4px solid var(--line);color:var(--taupe);padding:6px 14px;border-radius:100px;font-family:var(--ui);font-size:12px}
.icon-btn:hover{background:var(--cloud);color:var(--red)}
.empty{color:#9aa4ac;font-size:13.5px;text-align:center;padding:30px 0}

/* team grid */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:18px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tcard img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:top}
.tcard .in{padding:13px 15px 15px}
.tcard .nm{font-weight:700;font-size:14.5px;color:var(--navy)}
.tcard .tt{font-family:var(--ui);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:600;margin-top:3px}
.tcard .ops{display:flex;gap:4px;margin-top:9px}
.tcard .ops button{font-size:12px;padding:5px 12px;border-radius:100px;border:1.4px solid var(--line);background:#fff;color:var(--taupe)}
.tcard .ops button:hover{border-color:var(--navy);color:var(--navy)}
.tcard .ops button.rm:hover{border-color:var(--red);color:var(--red)}

/* blog list */
.brow{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.brow img{width:110px;height:72px;object-fit:cover;border-radius:10px;flex:none}
.brow .bt{font-weight:700;color:var(--navy);font-size:15px}
.brow .bm{font-family:var(--ui);font-size:11px;color:var(--taupe);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.brow .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.tag.live{background:#eaf3ee;color:var(--green)}
.tag.draft{background:#faf3e4;color:var(--amber)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(12,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.mcard{background:#fff;border-radius:10px;width:min(640px,94vw);max-height:88vh;overflow:auto;padding:30px 32px}
.mcard h3{color:var(--navy);font-size:19px;margin-bottom:4px}
.mcard .msub{color:var(--taupe);font-size:13px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}

/* chart */
.chart-wrap{position:relative}
.legend{display:flex;gap:18px;font-family:var(--ui);font-size:11.5px;color:var(--taupe);margin-top:10px}
.legend .sw{width:10px;height:10px;border-radius:10px;display:inline-block;margin-right:6px}

.toast{position:fixed;bottom:26px;right:26px;background:var(--midnight);color:#fff;padding:14px 20px;border-radius:10px;font-size:13.5px;box-shadow:0 20px 50px -12px rgba(0,0,0,.5);z-index:70;display:flex;gap:10px;align-items:center}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.tgrid{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media(max-width:760px){aside{display:none}.content{padding:20px 16px 60px}.topbar{padding:14px 16px}}
</style>
</head>

function chartDates(n){const out=[];const now=new Date();for(let i=n-1;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);out.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));}return out;}
function smoothPath(pts){
  if(pts.length<3)return 'M'+pts.map(p=>p[0]+','+p[1]).join(' L');
  let d='M'+pts[0][0]+','+pts[0][1];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+='C'+c1x+','+c1y+' '+c2x+','+c2y+' '+p2[0]+','+p2[1];
  }
  return d;
}
function renderChart(id,series,opts){
  opts=opts||{};
  const el=document.getElementById(id); if(!el)return;
  const W=680,H=opts.h||250,padL=46,padR=(series.length>1?46:16),padT=16,padB=28;
  const iw=W-padL-padR,ih=H-padT-padB,n=series[0].data.length;
  const maxes=series.map(s=>{const m=Math.max.apply(null,s.data);return Math.ceil(m*1.15/10)*10;});
  const X=i=>padL+(i/(n-1))*iw;
  const Y=(v,si)=>padT+ih-(v/maxes[si])*ih;
  const labels=chartDates(n);
  let g='',steps=4;
  for(let st=0;st<=steps;st++){
    const y=padT+ih-(st/steps)*ih;
    g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eeeae5" stroke-width="1"/>';
    g+='<text x="'+(padL-9)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="#9aa4ac" font-family="Geist,sans-serif">'+Math.round(maxes[0]*st/steps).toLocaleString()+'</text>';
    if(series.length>1)g+='<text x="'+(W-padR+9)+'" y="'+(y+3.5)+'" text-anchor="start" font-size="10" fill="#c08a7e" font-family="Geist,sans-serif">'+Math.round(maxes[1]*st/steps).toLocaleString()+'</text>';
  }
  const stepX=Math.ceil(n/6);
  for(let i=0;i<n;i+=stepX){
    g+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#9aa4ac" font-family="Geist,sans-serif">'+labels[i]+'</text>';
  }
  let defs='<defs>';
  series.forEach(function(s,si){defs+='<linearGradient id="'+id+'-g'+si+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+s.color+'" stop-opacity=".20"/><stop offset="100%" stop-color="'+s.color+'" stop-opacity="0"/></linearGradient>';});
  defs+='</defs>';
  let paths='';
  series.forEach(function(s,si){
    const pts=s.data.map(function(v,i){return [X(i),Y(v,si)];});
    const line=smoothPath(pts);
    paths+='<path d="'+line+' L'+X(n-1)+','+(padT+ih)+' L'+padL+','+(padT+ih)+' Z" fill="url(#'+id+'-g'+si+')"/>';
    paths+='<path d="'+line+'" fill="none" stroke="'+s.color+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>';
    const lx=X(n-1),ly=Y(s.data[n-1],si);
    paths+='<circle cx="'+lx+'" cy="'+ly+'" r="6.5" fill="'+s.color+'" opacity=".16"/><circle cx="'+lx+'" cy="'+ly+'" r="3.6" fill="'+s.color+'" stroke="#fff" stroke-width="1.4"/>';
  });
  el.setAttribute('viewBox','0 0 '+W+' '+H);
  el.style.display='block';
  el.innerHTML=defs+g+paths+'<g id="'+id+'-hv"></g><rect id="'+id+'-ov" x="'+padL+'" y="'+padT+'" width="'+iw+'" height="'+ih+'" fill="transparent" style="cursor:crosshair"/>';
  const ov=document.getElementById(id+'-ov'),hv=document.getElementById(id+'-hv');
  ov.addEventListener('mousemove',function(e){
    const r=el.getBoundingClientRect();
    const px=(e.clientX-r.left)*(W/r.width);
    let i=Math.round((px-padL)/iw*(n-1)); i=Math.max(0,Math.min(n-1,i));
    let tip='<line x1="'+X(i)+'" y1="'+padT+'" x2="'+X(i)+'" y2="'+(padT+ih)+'" stroke="#c9c2ba" stroke-width="1" stroke-dasharray="3 3"/>';
    const bw=128,bh=22+series.length*15;
    const bx=X(i)+10+bw>W-padR?X(i)-10-bw:X(i)+10;
    tip+='<rect x="'+bx+'" y="'+(padT+6)+'" width="'+bw+'" height="'+bh+'" rx="8" fill="#131E29" opacity=".95"/>';
    tip+='<text x="'+(bx+11)+'" y="'+(padT+21)+'" font-size="9.5" fill="#C4BCB7" font-family="Geist,sans-serif" letter-spacing=".04em">'+labels[i].toUpperCase()+'</text>';
    series.forEach(function(s,si){
      tip+='<circle cx="'+X(i)+'" cy="'+Y(s.data[i],si)+'" r="4.2" fill="'+s.color+'" stroke="#fff" stroke-width="1.6"/>';
      tip+='<text x="'+(bx+11)+'" y="'+(padT+36+si*14)+'" font-size="10.5" font-weight="600" fill="#fff" font-family="Geist,sans-serif">'+s.name+'  '+s.data[i].toLocaleString()+'</text>';
    });
    hv.innerHTML=tip;
  });
  ov.addEventListener('mouseleave',function(){hv.innerHTML='';});
}
