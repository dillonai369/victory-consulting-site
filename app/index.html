<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Victory Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#253746; --deep:#131E29; --off:#FCFBFA; --gold:#D69A2D; --muted:#746661; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--off); color:var(--navy);
    font-family:'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:32px;
    position:relative; overflow:hidden;
  }
  /* 19-degree brand angle */
  body::after{
    content:''; position:absolute; left:-10%; right:-10%; bottom:-32%; height:52%;
    background:var(--navy); transform:skewY(-19deg); z-index:0;
  }
  body::before{
    content:''; position:absolute; left:-10%; right:-10%; bottom:calc(-32% + 52%); height:3px;
    background:var(--gold); transform:skewY(-19deg); z-index:1;
  }
  .card{ position:relative; z-index:2; text-align:center; max-width:460px; }
  .mark{ width:74px; height:auto; margin-bottom:30px; }
  h1{ font-family:'Source Serif 4', Georgia, serif; font-weight:400; font-size:27px; letter-spacing:-.01em; margin-bottom:14px; }
  p{ color:var(--muted); font-size:16px; line-height:1.65; }
  a{ color:var(--navy); text-decoration:none; border-bottom:1px solid rgba(37,55,70,.3); padding-bottom:1px; }
  a:hover{ border-bottom-color:var(--gold); }
  .site{ margin-top:28px; font-size:15px; }
</style>
</head>
